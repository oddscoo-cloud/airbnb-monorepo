<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;600;700;800&family=Inder&display=swap" rel="stylesheet" />

  <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>

      <!-- Facebook SDK for JavaScript -->
      <script>
          window.fbAsyncInit = function () {
              FB.init({
                  appId: 'ВАШ_FACEBOOK_APP_ID', // Заменить на свой App ID, когда создаётся приложение в Facebook Developers
                  cookie: true,
                  xfbml: true,
                  version: 'v18.0'
              });
          };

          (function (d, s, id) {
              var js, fjs = d.getElementsByTagName(s)[0];
              if (d.getElementById(id)) { return; }
              js = d.createElement(s); js.id = id;
              js.src = "https://connect.facebook.net/en_US/sdk.js";
              fjs.parentNode.insertBefore(js, fjs);
          }(document, 'script', 'facebook-jssdk'));
      </script>
  </body>
</html>
