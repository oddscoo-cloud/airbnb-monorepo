services:
  postgres:
    image: postgres:16-alpine
    container_name: airbnb_postgres
    environment:
      POSTGRES_DB: airbnb_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airbnb_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: airbnb_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development включает автоприменение миграций и сидеров при старте.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=airbnb_db;Username=postgres;Password=${POSTGRES_PASSWORD:-postgrespassword}
      Jwt__Key: ${JWT_KEY:-development-only-key-replace-with-a-random-secret-32-chars}
      Admin__Email: ${ADMIN_EMAIL:-admin@homefu.local}
      Admin__Password: ${ADMIN_PASSWORD:-Admin12345!}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-HomeFU}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    ports:
      - "5189:8080"
    volumes:
      - listing_images:/app/wwwroot/listing-images
      - avatars:/app/wwwroot/avatars
      - verification_docs:/app/App_Data

  web:
    build: ./frontend
    container_name: airbnb_web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  listing_images:
  avatars:
  verification_docs:
